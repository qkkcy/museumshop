      padding:'10px 12px',cursor:'pointer',background:'#fff',
      borderRadius:'var(--r)',margin:'5px 12px',boxShadow:'var(--sh)'
    }});
    hdr.addEventListener('click',()=>{state._histOpenDates[date]=!isOpen;render();});

    const left=el('div',null,
      el('div',{style:{fontWeight:'600',fontSize:'12px'}},fmtDateFull(date)),
      el('div',{style:{fontSize:'10px',color:'var(--t3)',marginTop:'2px'}},
        `${recs.length}건`,
        inTotal>0?el('span',{style:{color:'var(--ok)',marginLeft:'6px',fontWeight:'600'}},`창고반입+${inTotal}`):null,
        siteTotal>0?el('span',{style:{color:'var(--p)',marginLeft:'6px',fontWeight:'600'}},`창고→현장+${siteTotal}`):null
      )
    );
    hdr.append(left,el('span',{style:{fontSize:'14px',color:'var(--p)'}},isOpen?'▲':'▼'));

    const body=isOpen?recs.map(r=>{
      const editBtn=el('button',{class:'del-btn',style:{color:'var(--pm)',fontSize:'12px'}},'✏️');
      editBtn.addEventListener('click',()=>{
        state.editWhId=r.id;
        state.wh={date:r.date,cat:r.cat,pid:r.productId,type:isFieldTransfer(r.type)?'창고→현장':r.type==='입고'?'창고반입':r.type,qty:String(r.qty),note:r.note||''};
        set({tab:0,stockTab:'wh'});
      });
      const delBtn=el('button',{class:'del-btn',style:{color:'var(--er)',fontWeight:'700',fontSize:'14px'}},'×');
      delBtn.addEventListener('click',e=>{
        e.stopPropagation();
        if(!confirm(`"${r.productName}" 기록을 삭제할까요?`))return;
        persist({...state.db,wh:toArr(state.db.wh).filter(x=>x.id!==r.id)});
        showToast('✓ 삭제됨');
      });
      const typeLabel=isFieldTransfer(r.type)?'창고→현장':(r.type==='입고'?'창고반입':r.type);
      const isIn=r.type==='창고반입'||r.type==='입고';
      const isSite=isFieldTransfer(r.type);
      return el('div',{class:'wh-rec',style:{margin:'2px 12px',borderRadius:'8px'}},
        el('div',null,
          el('div',{style:{fontWeight:'600',fontSize:'12px'}},r.productName,el('span',{class:`cb cb-${r.cat}`},r.cat)),
          r.note?el('div',{style:{fontSize:'9px',color:'var(--t3)',marginTop:'1px'}},r.note):null
        ),
        el('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
          el('span',{class:'wh-badge '+(isIn?'wh-in':isSite?'wh-site':'wh-out')},typeLabel),
          el('span',{style:{fontSize:'15px',fontWeight:'700',color:isIn?'var(--ok)':isSite?'var(--p)':'var(--er)'}},r.qty+'개'),
          editBtn,delBtn
        )
      );
    }):[];

    return el('div',null,hdr,...body);
  });

  return el('div',null,
    el('div',{class:'card'},
      el('div',{class:'ct'},'📋 창고 입출고 기록'),
      el('div',{style:{marginBottom:'6px'}},
        el('div',{style:{fontSize:'10px',color:'var(--t2)',marginBottom:'4px',fontWeight:'600'}},'월별'),
        el('div',{class:'pills'},
          ...[{val:'전체',label:'전체'},...months.map(m=>{
            const[y,mo]=m.split('-');
            return{val:m,label:`${y.slice(2)}.${parseInt(mo)}월`};
          })].map(({val,label})=>{
            const b=el('button',{class:'pill pill-sm'+(monthF===val?' on':'')},label);
            b.addEventListener('click',()=>{state._histMonth=val;state._histOpenDates={};render();});
            return b;
          })
        )
      ),
      el('div',{style:{marginBottom:'6px'}},
        el('div',{style:{fontSize:'10px',color:'var(--t2)',marginBottom:'4px',fontWeight:'600'}},'유형'),
        pillsEl(['전체','창고반입','창고→현장'],typeF,v=>{state._histType=v;state._histOpenDates={};render();},true)
      ),
      el('div',null,
        el('div',{style:{fontSize:'10px',color:'var(--t2)',marginBottom:'4px',fontWeight:'600'}},'카테고리'),
        pillsEl(['전체',...CATS],catF,v=>{state._histCat=v;state._histOpenDates={};render();},true)
      )
    ),
    el('div',{class:'card'},
      el('div',{class:'ct'},(()=>{
        if(monthF==='전체') return '📊 상품별 누적 수량 (전체)';
        const[y,mo]=monthF.split('-');
        const label=`${y}년 ${parseInt(mo)}월`;
        return `📊 상품별 누적 수량 (${label})`;
      })()),
      summaryTable
    ),
    el('div',{class:'sec-label'},'날짜별 상세'),
    dates.length===0?el('div',{class:'empty'},'기록이 없어요'):groups
  );
}


// ── 품목관리 페이지 ─────────────────────────────────────────
function prodPage(){
  const prods=getProds();
  const fp=state.formProd||{cat:'굿즈',name:'',sample:'',drawer:false,editId:null};
  const isEdit=!!fp.editId;

  function startEdit(prod){
    state.formProd={editId:prod.id,cat:prod.cat,name:prod.name,sample:prod.sample,drawer:prod.drawer};
    render();
  }
  function moveUp(idx){if(idx===0)return;const np=[...prods];[np[idx-1],np[idx]]=[np[idx],np[idx-1]];persist({...state.db,products:np});}
  function moveDown(idx){if(idx===prods.length-1)return;const np=[...prods];[np[idx],np[idx+1]]=[np[idx+1],np[idx]];persist({...state.db,products:np});}

  const rows=prods.map((prod,idx)=>{
    const up=el('button',{class:'del-btn',style:{color:idx===0?'var(--t3)':'var(--p)',fontSize:'11px'}},'↑');up.addEventListener('click',()=>moveUp(idx));
    const dn=el('button',{class:'del-btn',style:{color:idx===prods.length-1?'var(--t3)':'var(--p)',fontSize:'11px'}},'↓');dn.addEventListener('click',()=>moveDown(idx));
    const ed=el('button',{class:'del-btn',style:{color:'var(--pm)',fontSize:'12px'}},'✏️');ed.addEventListener('click',()=>startEdit(prod));
    const dl=el('button',{class:'del-btn',style:{color:'var(--er)',fontWeight:'700'}},'-');
    dl.addEventListener('click',()=>{if(!confirm(`"${prod.name}" 삭제할까요?`))return;persist({...state.db,products:prods.filter((_,i)=>i!==idx)});});
    return el('div',{class:'init-row',style:{backgroundColor:CAT_BG[prod.cat]}},
      el('div',{style:{display:'flex',gap:'0',flexShrink:0}},up,dn),
      el('div',{class:'init-name',style:{margin:'0 5px'}},prod.name,
        el('span',{class:`cb cb-${prod.cat}`},prod.cat),
        el('span',{style:{fontSize:'9px',color:'var(--t3)',marginLeft:'3px'}},`샘플${prod.sample}`)
      ),
      el('div',{style:{display:'flex',gap:'1px',flexShrink:0}},ed,dl)
    );
  });

  const catPills=pillsEl(CATS,fp.cat,c=>{state.formProd={...fp,cat:c};render();},true);
  const nameInp=el('input',{type:'text',class:'inp',value:fp.name,placeholder:'제품명 입력'});
  nameInp.addEventListener('input',e=>{state.formProd={...state.formProd,name:e.target.value};});
  const sampleInp=el('input',{type:'number',class:'inp',min:'0',value:fp.sample,placeholder:'0'});
  sampleInp.addEventListener('input',e=>{state.formProd={...state.formProd,sample:e.target.value};});
  const drawerCheck=el('input',{type:'checkbox'});drawerCheck.checked=!!fp.drawer;
  drawerCheck.addEventListener('change',e=>{state.formProd={...state.formProd,drawer:e.target.checked};});

  const saveBtn=el('button',{class:'sbtn sm'},isEdit?'수정 저장':'+ 품목 추가');
  saveBtn.addEventListener('click',()=>{
    if(!state.formProd.name.trim())return showToast('제품명을 입력해주세요');
    const sample=parseInt(state.formProd.sample)||0;
    if(isEdit){
      persist({...state.db,products:prods.map(p=>p.id===fp.editId?{...p,cat:state.formProd.cat,name:state.formProd.name.trim(),sample,drawer:!!state.formProd.drawer}:p)});
    } else {
      persist({...state.db,products:[...prods,{id:'C'+Date.now(),cat:state.formProd.cat,name:state.formProd.name.trim(),sample,drawer:!!state.formProd.drawer}]});
    }
    state.formProd=null;showToast(isEdit?'✓ 수정됨':'✓ 추가됨');
  });
  const cancelBtn=isEdit?el('button',{class:'sbtn sm sec'},'취소'):null;
  if(cancelBtn)cancelBtn.addEventListener('click',()=>{state.formProd=null;render();});
  const resetBtn=el('button',{class:'sbtn sm sec',style:{marginTop:'6px'}},'기본 17개 품목으로 초기화');
  resetBtn.addEventListener('click',()=>{if(!confirm('초기화할까요?'))return;persist({...state.db,products:[]});state.formProd=null;showToast('✓ 초기화됨');});

  return el('div',null,
    el('div',{class:'card'},
      el('div',{class:'ct'},`📋 품목 목록 (${prods.length}개)`),
      ...rows
    ),
    el('div',{class:'card',style:isEdit?{borderTop:'3px solid var(--p)'}:{}},
      el('div',{class:'ct'},isEdit?`✏️ "${fp.name}" 수정 중`:'➕ 품목 추가'),
      el('div',{style:{marginBottom:'8px'}},el('label',{class:'label'},'카테고리'),catPills),
      el('div',{style:{marginBottom:'7px'}},el('label',{class:'label'},'제품명'),nameInp),
      el('div',{style:{marginBottom:'7px',display:'flex',gap:'14px',alignItems:'center'}},
        el('label',{style:{display:'flex',alignItems:'center',gap:'5px',fontSize:'12px',cursor:'pointer'}},drawerCheck,'인포서랍 있음')
      ),
      el('div',{style:{marginBottom:'7px'}},el('label',{class:'label'},'샘플 고정수량'),sampleInp),
      saveBtn,cancelBtn
    ),
    el('div',{class:'card'},resetBtn)
  );
}

// ── 월별 판매 현황 페이지 ────────────────────────────────────
function salesPage(){
  const prods=getProds();

  // 데이터가 있는 월 목록
  const allMonths=[...new Set(
    toArr(state.db.site).map(r=>r.date.slice(0,7))
  )].sort((a,b)=>b.localeCompare(a));

  if(allMonths.length===0)
    return el('div',{class:'empty',style:{marginTop:'40px'}},'저장된 판매 기록이 없어요');

  if(!state._salesMo||!allMonths.includes(state._salesMo))
    state._salesMo=allMonths[0];

  const selMo=state._salesMo;
  const[selY,selM]=selMo.split('-');
  const moLabel=`${selY}년 ${parseInt(selM)}월`;

  // 월 선택 pill
  const moPills=el('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',padding:'4px 0'}});
  allMonths.forEach(mo=>{
    const[y,m]=mo.split('-');
    const b=el('button',{class:'pill pill-sm'+(mo===selMo?' on':'')},`${y.slice(2)}.${parseInt(m)}월`);
    b.addEventListener('click',()=>{state._salesMo=mo;render();});
    moPills.append(b);
  });

  // 해당 월 데이터 집계
  const moFrom=`${selMo}-01`;
  const moLastDay=new Date(parseInt(selY),parseInt(selM),0).getDate();
  const moTo=`${selMo}-${String(moLastDay).padStart(2,'0')}`;

  // 날짜별 최신 레코드 (중복 제거)
  const monthRecs=Object.values(
    toArr(state.db.site)
      .filter(r=>r.date>=moFrom&&r.date<=moTo)
      .reduce((map,r)=>{
        const k=r.productId+'_'+r.date;
        if(!map[k]||r.ts>map[k].ts)map[k]=r;
        return map;
      },{})
  );

  // 카테고리 필터
  const catF=state._salesCat||'전체';
  const filteredProds=prods.filter(p=>catF==='전체'||p.cat===catF);

  // 상품별 집계
  let totalSales=0,totalGift=0,totalWaste=0,totalOut=0;
  const rows=filteredProds.map(prod=>{
    const recs=monthRecs.filter(r=>r.productId===prod.id);
    const sales=recs.reduce((s,r)=>s+(parseInt(r.sales)||0),0);
    const gift=recs.reduce((s,r)=>s+toArr(r.outgoing||[]).filter(o=>o.type==='증정').reduce((a,o)=>a+(parseInt(o.qty)||0),0),0);
    const waste=recs.reduce((s,r)=>s+toArr(r.outgoing||[]).filter(o=>o.type==='폐기').reduce((a,o)=>a+(parseInt(o.qty)||0),0),0);    const out=sales+gift+waste;
    if(sales===0&&gift===0&&waste===0)return null;
    totalSales+=sales;totalGift+=gift;totalWaste+=waste;totalOut+=out;
    const bg=CAT_BG[prod.cat];
    return el('tr',null,
      el('td',{style:{backgroundColor:bg}},prod.name,el('span',{class:`cb cb-${prod.cat}`},prod.cat)),
      el('td',{style:{backgroundColor:bg,textAlign:'center',fontWeight:'600',color:'var(--acc)'}},sales||'-'),
      el('td',{style:{backgroundColor:bg,textAlign:'center',color:'var(--ok)'}},gift||'-'),
      el('td',{style:{backgroundColor:bg,textAlign:'center',color:'var(--er)'}},waste||'-'),
      el('td',{style:{backgroundColor:bg,textAlign:'center',fontWeight:'700',color:'var(--pm)'}},out||'-')
    );
  }).filter(Boolean);

  const hasData=rows.length>0;

  return el('div',null,
    el('div',{class:'card'},
      el('div',{class:'ct'},'📊 월별 판매 현황'),
      moPills,
      el('div',{style:{marginTop:'6px'}},
        pillsEl(['전체',...CATS],catF,v=>{state._salesCat=v;render();},true)
      )
    ),
    hasData?el('div',{class:'card'},
      el('div',{class:'ct'},`🛒 ${moLabel} 판매 집계`),
      el('div',{style:{display:'flex',gap:'8px',marginBottom:'8px',flexWrap:'wrap'}},
        el('div',{style:{flex:'1',minWidth:'60px',background:'#FFF8E1',borderRadius:'8px',padding:'8px',textAlign:'center'}},
          el('div',{style:{fontSize:'10px',color:'var(--t3)'}},'판매'),
          el('div',{style:{fontSize:'18px',fontWeight:'700',color:'var(--acc)'}},totalSales)
        ),
        el('div',{style:{flex:'1',minWidth:'60px',background:'#F1F8E9',borderRadius:'8px',padding:'8px',textAlign:'center'}},
          el('div',{style:{fontSize:'10px',color:'var(--t3)'}},'증정'),
          el('div',{style:{fontSize:'18px',fontWeight:'700',color:'var(--ok)'}},totalGift)
        ),
        el('div',{style:{flex:'1',minWidth:'60px',background:'#FFF0F0',borderRadius:'8px',padding:'8px',textAlign:'center'}},
          el('div',{style:{fontSize:'10px',color:'var(--t3)'}},'폐기'),
          el('div',{style:{fontSize:'18px',fontWeight:'700',color:'var(--er)'}},totalWaste)
        ),
        el('div',{style:{flex:'1',minWidth:'60px',background:'#EDE7F6',borderRadius:'8px',padding:'8px',textAlign:'center'}},
          el('div',{style:{fontSize:'10px',color:'var(--t3)'}},'총출고'),
          el('div',{style:{fontSize:'18px',fontWeight:'700',color:'var(--pm)'}},totalOut)
        )
      ),
      el('div',{class:'tbl-wrap'},el('table',{class:'tbl'},
        el('thead',null,el('tr',null,
          el('th',null,'제품명'),
          el('th',{style:{color:'#FFE082'}},'판매'),
          el('th',{style:{color:'#C8E6C9'}},'증정'),
          el('th',{style:{color:'#FFCDD2'}},'폐기'),
          el('th',null,'총출고')
        )),
        el('tbody',null,...rows)
      ))
    ):el('div',{class:'empty'},`${moLabel}에 판매 기록이 없어요`)
  );
}


function render(){
  // 로딩 중
  if(state._loading){
    const root=document.getElementById('app');
    root.innerHTML='';
    root.append(el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:'12px',color:'var(--t2)'}},
      el('div',{style:{fontSize:'28px'}},'🏛'),
      el('div',{style:{fontSize:'13px',fontWeight:'600'}},'뮤지엄샵 재고관리'),
      el('div',{style:{fontSize:'11px',color:'var(--t3)'}},'데이터 불러오는 중...')
    ));
    return;
  }
  // draft 초기화 (첫 렌더)
  if(!state._draftInit){
    state.draft=initDraft(state.selDate);
    state._draftInit=true;
  }

  // 스크롤 위치 저장
  const scrollY=window.scrollY;


  const root=document.getElementById('app');
  root.innerHTML='';
  root.append(
    el('div',{class:'hdr'},
      el('div',{class:'hdr-logo'},
        el('div',{class:'hdr-logo-text'},
          el('div',{class:'hdr-title'},'오디움'),
          el('div',{class:'hdr-line'}),
          el('div',{class:'hdr-sub'},'뮤 지 엄 샵')
        )
      ),
      el('div',{class:'hdr-r'},
      el('div',{style:{display:'flex',gap:'4px'}},
        state.tab===0&&state.stockTab==='site'?el('button',{class:'hdr-btn',onclick:()=>exportSite()},'현장기록'):null,
        state.tab===0&&state.stockTab==='wh'?el('button',{class:'hdr-btn',onclick:()=>exportWh()},'창고기록'):null,
        el('button',{class:'hdr-btn',style:{background:'rgba(255,255,255,.25)'},onclick:()=>set({_showExportPicker:true})},'⬇ 종합')
      )
    )
    ),
    state.tab===0?stockPage():state.tab===1?histPage():state.tab===2?salesPage():prodPage(),
    el('nav',{class:'nav'},
      ...['📦 재고','📋 입출고기록','📊 월별판매','⚙️ 품목관리'].map((lbl,i)=>{
        const b=el('button',{class:'nb'+(state.tab===i?' on':'')},
          el('span',{style:{fontSize:'16px'}},lbl.split(' ')[0]),
          el('span',null,lbl.split(' ')[1]),
          el('div',{class:'nb-dot'})
        );
        b.addEventListener('click',()=>set({tab:i}));return b;
      })
    )
  );
  if(state.toast)root.append(el('div',{class:'toast'},state.toast));

  // ── 검증 상세 오버레이 (월별 그룹) ──
  if(state._verifyOverlay){
    const{pid,productName,focusMo,showCumulative}=state._verifyOverlay;
    const prod=getProds().find(p=>p.id===pid);

    // 날짜별 최신 기록 (중복 제거, 오래된 순) — 판매만 기록된 날도 월 그룹에는 포함
    const allRecs=toArr(state.db.site).filter(r=>r.productId===pid);
    const dedMap=allRecs.reduce((m,r)=>{if(!m[r.date]||r.ts>m[r.date].ts)m[r.date]=r;return m;},{});
    const sortedAsc=Object.values(dedMap).sort((a,b)=>a.date.localeCompare(b.date));
    // 실재고 있는 기록만으로 "가장 최신 실사일" 산출 (verifyCell/mismatchBanner와 동일 기준)
    const latestInvRec=sortedAsc.filter(r=>isRealInv(r)).slice(-1)[0]||null;

    // 월별 그룹
    const moGrouped={};
    sortedAsc.forEach(rec=>{
      const mo=rec.date.slice(0,7);
      if(!moGrouped[mo])moGrouped[mo]=[];
      moGrouped[mo].push(rec);
    });
    const moKeys=Object.keys(moGrouped).sort((a,b)=>b.localeCompare(a)); // 최신 월 먼저

    const overlay=el('div',{style:{
      position:'fixed',inset:'0',background:'rgba(0,0,0,.5)',zIndex:'60',
      display:'flex',alignItems:'flex-end'
    }});
    overlay.addEventListener('click',e=>{if(e.target===overlay)set({_verifyOverlay:null});});

    const sheet=el('div',{style:{
      width:'100%',background:'#fff',borderRadius:'20px 20px 0 0',
      maxHeight:'88vh',display:'flex',flexDirection:'column',
      boxShadow:'0 -4px 24px rgba(0,0,0,.2)'
    }});

    // 헤더
    const hdr=el('div',{style:{
      padding:'14px 16px 10px',borderBottom:'.5px solid var(--bd)',
      position:'sticky',top:'0',background:'#fff',zIndex:'1',flexShrink:'0'
    }},
      el('div',{style:{width:'36px',height:'4px',background:'var(--bd)',borderRadius:'2px',margin:'0 auto 10px'}}),
      el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        el('div',null,
          el('div',{style:{fontWeight:'700',fontSize:'14px'}},`🔍 ${productName} 검증 이력`),
          el('div',{style:{fontSize:'10px',color:'var(--t3)',marginTop:'2px'}},'월별 실사 검증 내역 · 클릭하여 계산 상세 확인')
        ),
        el('button',{style:{
          background:'none',border:'none',fontSize:'20px',color:'var(--t3)',cursor:'pointer',padding:'0 4px'
        },onclick:()=>set({_verifyOverlay:null})},'×')
      )
    );

    // 현재 최신 실사 검증 상태 배지 (실재고 테이블과 동일 기준)
    const latestStatusBar=(()=>{
      if(!latestInvRec)return null;
      const lv=verify(pid,latestInvRec.date,getS(latestInvRec),getD(latestInvRec));
      const lBad=lv&&!lv.isFirst&&!lv.ok;
      const lOk=lv&&!lv.isFirst&&lv.ok;
      const lFirst=lv&&lv.isFirst;
      return el('div',{style:{
        display:'flex',alignItems:'center',gap:'8px',
        padding:'8px 16px',borderBottom:'.5px solid var(--bd)',
        background:lBad?'#FFF0F0':lOk?'#F1FFF8':'var(--surf2)',
        flexShrink:'0'
      }},
        el('span',{style:{fontSize:'10px',color:'var(--t3)'}},'최신 실사 ('+fmtDateFull(latestInvRec.date)+')'),
        lBad?el('span',{class:'ver',style:{fontSize:'11px',marginLeft:'auto'}},
            `불일치 ${lv.actual-lv.expectedFromBase>0?'+':''}${lv.actual-lv.expectedFromBase}개`)
          :lOk?el('span',{class:'vok',style:{fontSize:'11px',marginLeft:'auto'}},'✅ 일치')
          :lFirst?el('span',{style:{fontSize:'10px',color:'var(--t3)',marginLeft:'auto'}},'첫 실사')
          :null
      );
    })();

    const body=el('div',{style:{overflowY:'auto',flex:'1',padding:'0 0 24px'}});

    if(moKeys.length===0){
      body.append(el('div',{style:{textAlign:'center',color:'var(--t3)',padding:'40px',fontSize:'13px'}},'기록 없음'));
    } else {
      moKeys.forEach(mo=>{
        const [y,m]=mo.split('-');
        const recs=moGrouped[mo]; // 오래된 날짜 → 최신 날짜 순
        const moOk=recs.filter(r=>isRealInv(r)&&verify(pid,r.date,getS(r),getD(r))?.ok===true).length;
        const moBad=recs.filter(r=>isRealInv(r)&&verify(pid,r.date,getS(r),getD(r))?.ok===false).length;
        const moExpandKey='vover_'+pid+'_'+mo;
        // focusMo인 월은 기본 열림, 나머지는 state 따라감 (기본 열림)
        const isMoOpen=state._noteExpanded?.[moExpandKey]!==false;

        // 월 헤더
        const moHdrId='vmo_'+mo.replace('-','');
        const isFocus=mo===focusMo;
        const moHdr=el('div',{id:moHdrId,style:{
          display:'flex',alignItems:'center',gap:'8px',
          padding:'10px 16px 6px',
          background:isFocus?'#FFF3E0':'var(--surf2)',
          borderBottom:'.5px solid var(--bd)',
          borderLeft:isFocus?'3px solid var(--acc)':'3px solid transparent',
          cursor:'pointer',userSelect:'none'
        }},
          el('span',{style:{fontWeight:'700',fontSize:'13px',color:'var(--pm)'}}
            ,`${y}년 ${parseInt(m)}월`),
          el('span',{style:{fontSize:'11px',color:'var(--t3)'}},'('+recs.length+'건)'),
          moBad>0?el('span',{style:{
            background:'var(--er)',color:'#fff',borderRadius:'10px',
            padding:'1px 7px',fontSize:'10px',fontWeight:'700'
          }},`불일치 ${moBad}`):null,
          moOk>0?el('span',{style:{fontSize:'11px',color:'var(--ok)'}},'✅ '+moOk):null,
          el('span',{style:{marginLeft:'auto',fontSize:'11px',color:'var(--t3)'}}
            ,isMoOpen?'▲':'▼')
        );
        moHdr.addEventListener('click',()=>{
          if(!state._noteExpanded)state._noteExpanded={};
          state._noteExpanded[moExpandKey]=!isMoOpen;
          render();
        });
        body.append(moHdr);

        if(!isMoOpen)return;

        // 날짜 레코드들 (이 월 안에서 최신순으로)
        [...recs].sort((a,b)=>b.date.localeCompare(a.date)).forEach(rec=>{
          const dateStr=fmtDateFull(rec.date);

          // 판매만 입력한 날
          if(!isRealInv(rec)){
            const salesQty=(parseInt(rec.sales)||0)+toArr(rec.outgoing||[]).reduce((s,o)=>s+(parseInt(o.qty)||0),0);
            body.append(el('div',{style:{
              display:'flex',alignItems:'center',gap:'8px',
              padding:'8px 16px',borderBottom:'.5px solid var(--surf2)'
            }},
              el('span',{style:{fontSize:'11px',color:'var(--t3)',minWidth:'60px'}},dateStr),
              el('span',{style:{
                fontSize:'10px',background:'#FFF3E0',color:'var(--acc)',
                padding:'2px 8px',borderRadius:'8px',fontWeight:'600'
              }},`🛒 출고 -${salesQty}`),
              el('span',{style:{fontSize:'10px',color:'var(--t3)'}},'(실사 없음)')
            ));
            return;
          }

          const v=verify(pid,rec.date,getS(rec),getD(rec));
          const isBad=v&&!v.isFirst&&!v.ok;
          const isOk=v&&!v.isFirst&&v.ok;
          // diff는 누적 기준(expectedFromBase)으로 계산해야 실제 불일치 수량이 표시됨
          const diff=isBad?(v.actual-(v.expectedFromBase!==undefined?v.expectedFromBase:v.expected)):null;
          const memoKey=rec.date+'_'+pid;
          const savedMemo=rec.verifyNote||'';
          const isMemoOpen=!!state.verifyMemoOpen?.[memoKey];
          const total=getTotal(getS(rec),getD(rec),prod);

          const recRow=el('div',{style:{
            padding:'8px 16px 10px',borderBottom:'.5px solid var(--surf2)',
            background:isBad?'#FFF5F5':isOk?'#F9FFFE':'#fff'
          }});

          // 날짜 + 결과
          const topLine=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap',marginBottom:'6px'}});
          topLine.append(
            el('span',{style:{fontSize:'11px',fontWeight:'700',color:isBad?'var(--er)':isOk?'var(--t2)':'var(--t3)',minWidth:'64px'}},dateStr)
          );
          if(!v||v.isFirst){
            topLine.append(el('span',{style:{fontSize:'10px',color:'var(--t3)',background:'var(--surf2)',padding:'2px 7px',borderRadius:'8px'}},'첫 실사 (비교할 이전 기록 없음)'));
          } else if(isOk){
            // ok:true = 기준점 대비 누적 계산도 일치 → 완전 해소
            topLine.append(el('span',{class:'vok',style:{fontSize:'11px'}},'✅ 일치'));
          } else {
            // 불일치
            topLine.append(
              el('span',{class:'ver',style:{fontSize:'10px',padding:'2px 8px'}},`불일치 ${diff>0?'+':''}${diff}개`)
            );
            const memoBtn=el('button',{style:{
              background:savedMemo?'#FFF3CD':'none',
              border:'1px solid '+(savedMemo?'var(--acc)':'var(--bd2)'),
              borderRadius:'10px',padding:'1px 6px',fontSize:'9px',cursor:'pointer',
              color:savedMemo?'var(--acc)':'var(--t3)'
            }},savedMemo?'📝 메모':'+ 메모');
            memoBtn.addEventListener('click',e=>{
              e.stopPropagation();
              state.verifyMemoOpen={...state.verifyMemoOpen,[memoKey]:!isMemoOpen};
              render();
            });
            topLine.append(memoBtn);
          }
          topLine.append(el('span',{style:{marginLeft:'auto',fontSize:'10px',color:'var(--t3)'}},`실사합계 ${total}개`));
          recRow.append(topLine);

          // 계산 내역 — 첫 실사 기준 누적으로 표시
          if(v&&!v.isFirst){
            const firstDate=v.firstDate||v.prevDate;
            const firstTotal=v.firstTotal||v.prevTotal; // 첫 실사 합계
            const transfer=v.transfer||0;
            // 첫 실사일 이후 ~ 현재 실사일 당일 포함 출고 목록
            const midRecs=Object.values(
              toArr(state.db.site)
                .filter(r=>r.productId===pid&&r.date>=firstDate&&r.date<=rec.date)
                .reduce((map,r)=>{if(!map[r.date]||r.ts>map[r.date].ts)map[r.date]=r;return map;},{})
            ).sort((a,b)=>a.date.localeCompare(b.date));

            const calcBox=el('div',{style:{
              fontSize:'10px',background:isBad?'#FFF0F0':'#F8F8F8',
              padding:'7px 10px',borderRadius:'7px',lineHeight:'1.9',
              borderLeft:'3px solid '+(isBad?'var(--er)':isOk?'var(--ok)':'var(--bd)')
            }});
            calcBox.append(
              el('div',{style:{color:'var(--t3)',marginBottom:'3px'}},`📐 계산 기준: ${fmtDateFull(firstDate)} → ${dateStr}`)
            );
            // 첫 실사
            calcBox.append(el('div',null,
              el('span',{style:{color:'var(--t2)'}},'첫 실사'),
              el('span',{style:{fontWeight:'700',color:'var(--pm)',float:'right'}},`${v.firstTotal||firstTotal}개`)
            ));
            // 출고 내역 (당일 포함)
            midRecs.forEach(mr=>{
              const mSales=parseInt(mr.sales)||0;
              const mOut=toArr(mr.outgoing||[]).reduce((s,o)=>s+(parseInt(o.qty)||0),0);
              const mTotal=mSales+mOut;
              if(mTotal===0)return;
              const parts=[];
              if(mSales>0)parts.push(`판매 ${mSales}`);
              toArr(mr.outgoing||[]).forEach(o=>{if((parseInt(o.qty)||0)>0)parts.push(`${o.type} ${parseInt(o.qty)}`);});
              calcBox.append(el('div',{style:{color:'var(--er)'}},
                el('span',null,`  ${fmtDate(mr.date)} 출고`),
                el('span',{style:{float:'right'}},`-${mTotal}개 (${parts.join(', ')})`)
              ));
            });
            if(transfer>0){
              calcBox.append(el('div',{style:{color:'var(--ok)'}},
                el('span',null,'  반입'),
                el('span',{style:{float:'right'}},`+${transfer}개`)
              ));
            }
            // 예상 vs 실사 (모두 firstRec 누적 기준)
            calcBox.append(el('div',{style:{borderTop:'1px solid var(--bd)',marginTop:'4px',paddingTop:'4px'}},
              el('span',{style:{color:'var(--pm)',fontWeight:'600'}},'예상'),
              el('span',{style:{fontWeight:'700',color:'var(--pm)',float:'right'}},`${v.expectedFromBase}개`)
            ));
            calcBox.append(el('div',null,
              el('span',{style:{color:isBad?'var(--er)':isOk?'var(--ok)':'var(--t2)',fontWeight:'700'}},'실사'),
              el('span',{style:{fontWeight:'700',color:isBad?'var(--er)':isOk?'var(--ok)':'var(--t2)',float:'right'}},
                `${v.actual}개${isBad?'  →  차이 '+(diff>0?'+':'')+diff+'개':''}`)
            ));
            recRow.append(calcBox);
          }

          // 메모
          if(isMemoOpen&&isBad){
            recRow.append(buildMemoInput(memoKey,savedMemo,pid,rec.date));
          } else if(savedMemo&&!isMemoOpen){
            recRow.append(el('div',{style:{
              marginTop:'4px',fontSize:'9px',color:'var(--acc)',
              background:'#FFF8E1',padding:'3px 7px',borderRadius:'5px',wordBreak:'break-all'
            }},`📝 ${savedMemo}`));
          }

          body.append(recRow);
        });
      });
    }

    sheet.append(hdr,...(latestStatusBar?[latestStatusBar]:[]),body);
    overlay.append(sheet);
    root.append(overlay);

    // focusMo로 자동 스크롤
    if(focusMo){
      requestAnimationFrame(()=>{
        const target=document.getElementById('vmo_'+focusMo.replace('-',''));
        if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
      });
    }
  }

  // ── 엑셀 내보내기 월 선택 바텀시트 ──
  if(state._showExportPicker){
    // 기록이 있는 월 목록
    const siteMonthsAll=[...new Set(
      toArr(state.db.site).map(r=>r.date.slice(0,7))
    )].sort((a,b)=>b.localeCompare(a));

    const selKey=`${state.siteRecYear}-${String(state.siteRecMonth).padStart(2,'0')}`;

    // 오버레이 (클릭 시 닫기)
    const overlay=el('div',{style:{
      position:'fixed',inset:'0',background:'rgba(0,0,0,.45)',zIndex:'50',
      display:'flex',alignItems:'flex-end'
    }});
    overlay.addEventListener('click',e=>{if(e.target===overlay)set({_showExportPicker:false});});

    // 시트 본체
    const sheet=el('div',{style:{
      width:'100%',background:'#fff',borderRadius:'20px 20px 0 0',
      padding:'0 0 calc(20px + env(safe-area-inset-bottom))',
      maxHeight:'80vh',overflowY:'auto',
      boxShadow:'0 -4px 24px rgba(0,0,0,.18)'
    }});

    // 핸들바 + 타이틀
    const titleRow=el('div',{style:{padding:'14px 16px 8px',borderBottom:'.5px solid var(--bd)',position:'sticky',top:'0',background:'#fff',zIndex:'1'}},
      el('div',{style:{width:'36px',height:'4px',background:'var(--bd)',borderRadius:'2px',margin:'0 auto 10px'}}),
      el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        el('div',null,
          el('div',{style:{fontWeight:'700',fontSize:'14px'}},'📋 실사기록 엑셀 내보내기'),
          el('div',{style:{fontSize:'10px',color:'var(--t3)',marginTop:'2px'}},'내보낼 월을 선택하세요')
        ),
        el('button',{style:{
          background:'none',border:'none',fontSize:'20px',color:'var(--t3)',
          cursor:'pointer',padding:'0 4px',lineHeight:'1'
        },onclick:()=>set({_showExportPicker:false})},'×')
      )
    );

    // 월 선택 pill 목록
    const pillsWrap=el('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'10px'}});

    if(siteMonthsAll.length===0){
      pillsWrap.append(el('div',{style:{textAlign:'center',color:'var(--t3)',fontSize:'12px',padding:'20px'}},'저장된 실사기록이 없어요'));
    } else {
      // ── 전체 버튼 ──
      const totalCnt=toArr(state.db.site).length;
      const isAllOn=!!state._siteRecAll;
      const allBtn=el('button',{style:{
        width:'100%',padding:'10px 14px',borderRadius:'12px',
        border:'1.5px solid '+(isAllOn?'var(--p)':'var(--bd)'),
        background:isAllOn?'var(--p)':'var(--surf2)',
        color:isAllOn?'#fff':'var(--t)',
        fontSize:'12px',fontWeight:isAllOn?'700':'500',cursor:'pointer',
        display:'flex',alignItems:'center',justifyContent:'space-between'
      }},
        el('span',null,'📂 전체 기록'),
        el('span',{style:{fontSize:'10px',color:isAllOn?'rgba(255,255,255,.8)':'var(--t3)',fontWeight:'400'}},totalCnt+'건 전체')
      );
      allBtn.addEventListener('click',()=>{state._siteRecAll=true;render();});
      pillsWrap.append(allBtn);
      pillsWrap.append(el('div',{style:{fontSize:'10px',fontWeight:'700',color:'var(--t2)',marginTop:'4px'}},'또는 월별 선택'));

      // 연도별 그룹
      const byYear={};
      siteMonthsAll.forEach(mo=>{
        const y=mo.slice(0,4);
        if(!byYear[y])byYear[y]=[];
        byYear[y].push(mo);
      });
      Object.keys(byYear).sort((a,b)=>b-a).forEach(y=>{
        pillsWrap.append(el('div',{style:{fontSize:'10px',fontWeight:'700',color:'var(--t2)',marginBottom:'4px'}},y+'년'));
        const row=el('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
        byYear[y].forEach(mo=>{
          const[,m]=mo.split('-');
          const cnt=toArr(state.db.site).filter(r=>r.date.startsWith(mo)).length;
          const isOn=!isAllOn&&mo===selKey;
          const btn=el('button',{style:{
            padding:'6px 14px',borderRadius:'20px',border:'1.5px solid '+(isOn?'var(--p)':'var(--bd)'),
            background:isOn?'var(--p)':'#fff',color:isOn?'#fff':'var(--t)',
            fontSize:'12px',fontWeight:isOn?'700':'400',cursor:'pointer',
            display:'flex',flexDirection:'column',alignItems:'center',gap:'1px'
          }},
            el('span',null,parseInt(m)+'월'),
            el('span',{style:{fontSize:'8px',color:isOn?'rgba(255,255,255,.8)':'var(--t3)'}},cnt+'건')
          );
          btn.addEventListener('click',()=>{
            state.siteRecYear=Number(y);
            state.siteRecMonth=Number(m);
            state._siteRecAll=false;
            render();
          });
          row.append(btn);
        });
        pillsWrap.append(row);
      });
    }

    // 내보내기 버튼
    const siteRecCnt=state._siteRecAll
      ?toArr(state.db.site).length
      :(siteMonthsAll.length>0?toArr(state.db.site).filter(r=>r.date.startsWith(selKey)).length:0);
    const expBtnLabel=state._siteRecAll
      ?`📥 전체 실사기록 내보내기 (${siteRecCnt}건)`
      :`📥 ${state.siteRecYear}년 ${state.siteRecMonth}월 실사기록 내보내기 (${siteRecCnt}건)`;
    const expBtn=el('button',{style:{
      width:'calc(100% - 32px)',margin:'8px 16px 0',padding:'13px',
      background:'var(--p)',color:'#fff',border:'none',
      borderRadius:'var(--r)',fontSize:'13px',fontWeight:'700',cursor:'pointer'
    }},expBtnLabel);
    expBtn.addEventListener('click',()=>{
      set({_showExportPicker:false});
      setTimeout(()=>exportAll(),50);
    });

    sheet.append(titleRow,pillsWrap,expBtn);
    overlay.append(sheet);
    root.append(overlay);
  }

  // 스크롤 위치 복원
  requestAnimationFrame(()=>{
    window.scrollTo(0,scrollY);

  });
}
window.addEventListener('resize',()=>render());
window.addEventListener('orientationchange',()=>setTimeout(render,150));
render();

// Service Worker 등록
if('serviceWorker' in navigator){
  const swCode=`
const CACHE='museumshop-v1';
const ASSETS=['/'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
self.addEventListener('fetch',e=>{
  if(e.request.url.includes('firebase')||e.request.url.includes('googleapis'))return;
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));
});
  `.trim();
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
</body>
</html>
